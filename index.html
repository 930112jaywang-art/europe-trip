<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13283d">
<title>歐洲聖誕旅程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

/* Layout: one-column phone view — clock header, "now" + departure-board style "next" ticket, then day strip and the day's timeline */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14202b; --muted:#5d6b78; --line:#d5dde4;
  --board:#13283d; --board-ink:#f4f7fa; --amber:#e8a317; --accent:#1f5f8b; --warn:#b4471f; --warn-bg:#fbe9e1;
  --land:#e6ebef; --land-hi:#f9fafb; --border:#b7c4cf; --train:#1f5f8b; --mtn:#2f8a57; --bus:#c98a0c; --air:#6f62a8;
  --f-sign:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c151e; --surface:#14212d; --ink:#e7edf2; --muted:#93a3b2; --line:#253545;
  --board:#081019; --board-ink:#f4f7fa; --amber:#f0b43a; --accent:#6fb0dd; --warn:#f08a62; --warn-bg:#3a1f16;
  --land:#182633; --land-hi:#1f3142; --border:#3a5063; --train:#6fb0dd; --mtn:#5cc48a; --bus:#f0b43a; --air:#a99be0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c151e; --surface:#14212d; --ink:#e7edf2; --muted:#93a3b2; --line:#253545;
  --board:#081019; --board-ink:#f4f7fa; --amber:#f0b43a; --accent:#6fb0dd; --warn:#f08a62; --warn-bg:#3a1f16;
  --land:#182633; --land-hi:#1f3142; --border:#3a5063; --train:#6fb0dd; --mtn:#5cc48a; --bus:#f0b43a; --air:#a99be0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.clock{font-family:var(--f-sign);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font-size:16px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:.04em}
.city{text-align:right}
.city b{display:block;font-size:18px}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.banner b{font-family:var(--f-sign);font-size:20px;color:var(--accent)}
h2{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:700}
.now{background:var(--surface);border-radius:12px;padding:16px;border:1px solid var(--line)}
.now .t{font-family:var(--f-sign);font-weight:600;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.now h3{margin:2px 0 6px;font-size:21px;line-height:1.3;text-wrap:balance}
.note{color:var(--muted);font-size:14px;margin:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px;font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;
  background:var(--accent);color:var(--surface);border:0;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:focus-visible,.chip:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* departure-board ticket */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.board .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.board .dep{font-family:var(--f-sign);font-size:34px;font-weight:700;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.board .dur{font-family:var(--f-sign);font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.board .dur b{font-size:26px;color:var(--board-ink);margin-left:4px}
.board h3{margin:0;font-size:19px;line-height:1.35}
.route{display:flex;align-items:center;gap:8px;font-family:var(--f-sign);font-size:18px;font-weight:600;letter-spacing:.02em;flex-wrap:wrap}
.route .arr{color:var(--amber)}
.line{display:inline-block;background:var(--amber);color:var(--board);font-family:var(--f-sign);font-weight:700;font-size:14px;padding:1px 8px;border-radius:4px;letter-spacing:.04em}
.board p{margin:0;font-size:14px;opacity:.88}
.board .btn{background:var(--amber);color:var(--board)}
.board .btn.ghost{background:transparent;color:var(--board-ink);border-color:rgba(244,247,250,.5)}
.board .warn{margin-top:0}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:54px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.chip .d{font-family:var(--f-sign);font-weight:700;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip .w{font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--board);border-color:var(--board);color:var(--board-ink)}
.chip[aria-pressed="true"] .w{color:var(--amber)}
.dayhead{font-size:17px;font-weight:700;margin:4px 0 2px}
[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button,.seg button{font:inherit;font-weight:600;border:0;border-radius:7px;padding:9px 6px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--board);color:var(--board-ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs button:focus-visible,.seg button:focus-visible,.legs button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;width:100%;aspect-ratio:4/3;max-height:75vh}
.mapbox svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapbox svg:active{cursor:grabbing}
.mapbox.full{position:fixed;inset:0;z-index:50;aspect-ratio:auto;max-height:none;height:100%;border:0;border-radius:0}
.mapctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.mapbox.full .mapctl{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.mapctl button{width:42px;height:42px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 22px/1 var(--f-body);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.mapctl button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mapinfo{position:absolute;left:10px;bottom:10px;right:64px;background:var(--board);color:var(--board-ink);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.4;pointer-events:none}
.mapinfo b{color:var(--amber);font-family:var(--f-sign);font-size:15px;margin-right:4px}
.mapinfo{display:none}
.mapbox.full .mapinfo{display:block;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.mapbox .leg,.mapbox .badge,.mapbox .htl{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--air) 0 5px,transparent 5px 9px)}
.legend i.sq{width:11px;height:11px;border-radius:2px;background:var(--warn)}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legs button{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;font:inherit;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.legs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.legs .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-sign);font-weight:700;font-size:15px}
.legs .mid{min-width:0}
.legs .mid b{display:block}
.legs .mid span{font-size:13px;color:var(--muted)}
.legs .dd{font-family:var(--f-sign);font-weight:600;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.legs .dd small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.hotels{display:flex;flex-direction:column;gap:10px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.hcard .lbl{font-size:12px;letter-spacing:.08em;color:var(--warn);font-weight:700}
.hcard h3{margin:2px 0 0;font-size:17px}
.hcard .addr{font-size:13px;color:var(--muted)}
.hcard ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.hcard li{border-top:1px solid var(--line)}
.hcard li a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;color:var(--ink);text-decoration:none;font-size:15px}
.hcard li a span:first-child{color:var(--accent);font-weight:600}
.hcard li .t{font-family:var(--f-sign);font-weight:600;font-size:17px;white-space:nowrap}
.hcard.pending{color:var(--muted);font-size:14px}
.stay{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0 4px;font-size:14px}
.stay .lbl{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stay b{display:block}
.stay .addr{font-size:13px;color:var(--muted)}
.stay a{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .tm{font-family:var(--f-sign);font-weight:600;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .body{min-width:0}
.tl .ti{font-weight:700}
.tl .go{font-size:13px;color:var(--accent);margin-top:3px}
.tl .mini{font-size:13px;color:var(--muted);margin-top:2px}
.tl li.cur .tm{color:var(--amber)}
.tl li.cur .ti::before{content:"● ";color:var(--amber)}
.tl li.past{opacity:.55}
.tl a{color:var(--accent);font-size:13px;font-weight:600}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
summary{cursor:pointer;font-weight:600;color:var(--muted)}
.sim{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sim input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.foot{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.board{animation:in .35s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="tzLabel">歐洲時間</div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="city"><span class="eyebrow" id="dateLabel"></span><b id="cityLabel"></b></div>
  </header>

  <div class="tabs" role="tablist" aria-label="切換畫面">
    <button type="button" role="tab" id="tabTrip" aria-selected="true">行程</button>
    <button type="button" role="tab" id="tabMap" aria-selected="false">地圖・交通・住宿</button>
  </div>

  <div id="viewTrip" class="view">
  <div class="banner" id="banner" hidden></div>

  <section id="nowSec">
    <h2>現在</h2>
    <div class="now" id="nowCard"></div>
  </section>

  <section id="nextSec">
    <h2 id="nextLabel">下一步</h2>
    <div class="board" id="nextCard"></div>
  </section>

  <section>
    <h2>每日行程</h2>
    <div class="days" id="days" role="group" aria-label="選擇日期"></div>
    <div class="dayhead" id="dayHead"></div>
    <div class="stay" id="stay" hidden></div>
    <ol class="tl" id="timeline"></ol>
  </section>

  <details id="simBox">
    <summary>模擬時間（出發前預覽用）</summary>
    <div class="sim">
      <input type="datetime-local" id="simInput" value="2026-12-24T16:30">
      <button class="btn" id="simOn" type="button">套用</button>
      <button class="btn ghost" id="simOff" type="button">回到真實時間</button>
    </div>
  </details>
  </div>

  <div id="viewMap" class="view" hidden>
    <div class="seg" role="group" aria-label="地圖範圍" id="regionBtns">
      <button type="button" data-r="all" aria-pressed="true">全覽</button>
      <button type="button" data-r="de" aria-pressed="false">德國</button>
      <button type="button" data-r="ch" aria-pressed="false">瑞士</button>
      <button type="button" data-r="paris" aria-pressed="false">巴黎</button>
    </div>
    <div class="mapbox" id="mapbox">
      <svg id="map" role="img" aria-label="旅程路線地圖" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="mapctl">
        <button type="button" id="zFull" aria-label="全螢幕"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button type="button" id="zIn" aria-label="放大">+</button>
        <button type="button" id="zOut" aria-label="縮小">−</button>
        <button type="button" id="zFit" aria-label="回到整個範圍">↺</button>
      </div>
      <div class="mapinfo" id="mapInfo"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--train)"></i>火車</span>
      <span><i style="background:var(--mtn)"></i>登山火車・船・纜車</span>
      <span><i style="background:var(--bus)"></i>遊覽車</span>
      <span><i class="dash"></i>飛機</span>
      <span><i class="sq"></i>住宿</span>
    </div>
    <div class="board" id="legCard"></div>
    <section>
      <h2>城市間交通</h2>
      <ol class="legs" id="legList"></ol>
    </section>
    <section>
      <h2>住宿與周邊路程</h2>
      <div class="hotels" id="hotelList"></div>
    </section>
  </div>

</div>

const $=id=>document.getElementById(id);
let simDate=null, selected=null, userPicked=false;

function partsIn(tz, date){
  const f=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const o={};f.formatToParts(date).forEach(p=>o[p.type]=p.value);
  const h=o.hour==="24"?"00":o.hour;
  return {date:`${o.year}-${o.month}-${o.day}`,hm:`${h}:${o.minute}`,min:+h*60+ +o.minute};
}
const toMin=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const md=d=>{const[,m,dd]=d.split("-");return `${+m}/${+dd}`};
function nowInfo(){
  // sim: user enters Europe local time
  if(simDate){const[d,t]=simDate.split("T");return {eu:{date:d,hm:t,min:toMin(t)},tw:null,sim:true}}
  const n=new Date();return {eu:partsIn(EU,n),tw:partsIn(TW,n),sim:false};
}
function locate(info){
  // find day index and its local time
  for(let i=0;i<TRIP.length;i++){
    const day=TRIP[i];
    const p=day.tz===EU||info.sim?info.eu:info.tw;
    if(p.date===day.d) return {i,p};
  }
  return null;
}
function mapsUrl(dest,walk){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest)+"&travelmode="+(walk?"walking":"transit")}
const RAIL={de:["https://www.bahn.com/en","查 DB 班次"],ch:["https://www.sbb.ch/en","查 SBB 班次"],fr:["https://www.sncf-connect.com/en-en/","查 SNCF 班次"]};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const info=nowInfo(), loc=locate(info);
  const first=TRIP[1].d;
  // clock
  $("clock").innerHTML=esc(info.eu.hm)+"<small>"+(info.sim?"模擬":"CET")+"</small>";
  $("tzLabel").textContent=info.sim?"模擬時間":"歐洲時間";
  const banner=$("banner");
  let cur=null,next=null,nextDayLabel=null;
  if(loc){
    const day=TRIP[loc.i], items=day.items, m=loc.p.min;
    let ci=-1;items.forEach((it,k)=>{if(toMin(it.t)<=m)ci=k});
    cur=ci>=0?{day,it:items[ci],k:ci}:null;
    if(ci+1<items.length) next={day,it:items[ci+1]};
    else if(TRIP[loc.i+1]){next={day:TRIP[loc.i+1],it:TRIP[loc.i+1].items[0]};nextDayLabel=md(TRIP[loc.i+1].d)+" 第一站"}
    if(!userPicked) selected=loc.i;
    $("dateLabel").textContent=md(day.d)+"（"+day.w+"）";
    $("cityLabel").textContent=day.city;
    if(day.warn){banner.hidden=false;banner.innerHTML="⚠ "+esc(day.warn)}else banner.hidden=true;
  }else{
    const before=info.eu.date<TRIP[0].d;
    if(selected===null) selected=1;
    $("dateLabel").textContent=before?"還沒出發":"旅程已結束";
    $("cityLabel").textContent=before?"台北":"歡迎回家";
    if(before){
      const days=Math.ceil((Date.parse(TRIP[0].d+"T00:00:00+08:00")-Date.now())/864e5);
      banner.hidden=false;
      banner.innerHTML=`還有 <b>${days}</b> 天出發`;
      next={day:TRIP[0],it:TRIP[0].items[0]};nextDayLabel="12/18 出發";
    }else banner.hidden=true;
  }
  // now card
  const nc=$("nowCard");
  if(cur){
    const it=cur.it;
    nc.innerHTML=`<div class="t">${it.t} 起</div><h3>${esc(it.title)}</h3>${it.warn?`<div class="warn">⚠ ${esc(it.warn)}</div>`:""}
      <div class="btns">${it.q?`<a class="btn ghost" target="_blank" rel="noopener" href="${mapsUrl(it.q,0)}">在地圖上看</a>`:""}${it.link?`<a class="btn ghost" target="_blank" rel="noopener" href="${it.link.href}">${esc(it.link.label)}</a>`:""}</div>`;
    $("nowSec").hidden=false;
  }else if(loc){
    nc.innerHTML=`<h3>今天的行程還沒開始</h3>`;$("nowSec").hidden=false;
  }else $("nowSec").hidden=true;
  // next ticket
  const bc=$("nextCard");
  if(next){
    const it=next.it,g=it.go;
    $("nextLabel").textContent=nextDayLabel?"下一步・"+nextDayLabel:"下一步";
    let html=`<div class="row"><span class="dep">${it.t}</span>${g?`<span class="dur">車程<b>${esc(g.dur)}</b></span>`:""}</div><h3>${esc(it.title)}</h3>`;
    if(g){
      html+=`<div class="route">${g.line?`<span class="line">${esc(g.line)}</span>`:""}<span>${esc(g.mode)}</span></div>
      <div class="route"><span>${esc(g.from)}</span><span class="arr">→</span><span>${esc(g.to.split(",")[0])}</span></div>`;
    }
    if(it.warn) html+=`<div class="warn">⚠ ${esc(it.warn)}</div>`;
    const dest=g?g.to:it.q;
    html+=`<div class="btns">${dest?`<a class="btn" target="_blank" rel="noopener" href="${mapsUrl(dest,g&&g.walk)}">從我目前位置導航</a>`:""}${g&&g.rail?`<a class="btn ghost" target="_blank" rel="noopener" href="${RAIL[g.rail][0]}">${RAIL[g.rail][1]}</a>`:""}</div>`;
    bc.innerHTML=html;$("nextSec").hidden=false;
  }else $("nextSec").hidden=true;
  renderDays(loc,cur);
}

function renderDays(loc,cur){
  const box=$("days");
  if(!box.childElementCount){
    TRIP.forEach((d,i)=>{const b=document.createElement("button");b.type="button";b.className="chip";b.id="day-"+i;
      b.innerHTML=`<span class="d">${md(d.d)}</span><span class="w">週${d.w}</span>`;
      b.addEventListener("click",()=>{selected=i;userPicked=true;renderDays(locate(nowInfo()),null)});box.appendChild(b)});
  }
  [...box.children].forEach((b,i)=>b.setAttribute("aria-pressed",i===selected?"true":"false"));
  const sel=box.children[selected];if(sel&&!userPicked)sel.scrollIntoView({block:"nearest",inline:"center"});
  const day=TRIP[selected];
  $("dayHead").textContent=md(day.d)+"（"+day.w+"）"+day.title;
  const st=$("stay");
  if(day.stay){st.hidden=false;st.innerHTML=`<div><span class="lbl">今晚住宿</span><b>${esc(day.stay.name)}</b></div><a target="_blank" rel="noopener" href="${mapsUrl(day.stay.q,0)}">導航 →</a>`}
  else{st.hidden=false;st.innerHTML=`<div><span class="lbl">今晚住宿</span><span class="addr">待補</span></div>`}
  if(selected===0||selected===TRIP.length-1||day.d==="2027-01-03")st.hidden=true;
  const isToday=loc&&loc.i===selected, m=isToday?loc.p.min:null;
  let ci=-1;if(isToday)day.items.forEach((it,k)=>{if(toMin(it.t)<=m)ci=k});
  $("timeline").innerHTML=day.items.map((it,k)=>{
    const cls=isToday?(k===ci?"cur":k<ci?"past":""):"";
    const g=it.go, dest=g?g.to:it.q;
    return `<li class="${cls}"><span class="tm">${it.t}</span><div class="body"><div class="ti">${esc(it.title)}</div>
      ${g?`<div class="go">${esc(g.mode)}${g.line?"・"+esc(g.line):""}・${esc(g.dur)}</div>`:""}
      ${it.warn?`<div class="warn">⚠ ${esc(it.warn)}</div>`:""}
      ${dest?`<a target="_blank" rel="noopener" href="${mapsUrl(dest,g&&g.walk)}">導航 →</a>`:""}</div></li>`}).join("");
}

$("simOn").addEventListener("click",()=>{const v=$("simInput").value;if(v){simDate=v;userPicked=false;render()}});
$("simOff").addEventListener("click",()=>{simDate=null;userPicked=false;selected=null;render()});
render();
setInterval(()=>{if(!simDate)render()},30000);

  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1];const c=[mx-dy*bend,my+dx*bend];
  return {d:`M${a[0].toFixed(1)},${a[1].toFixed(1)}Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`,

const svgEl=$("map");
function fitAspect(v){const r=(svgEl.clientWidth/svgEl.clientHeight)||4/3;let[x,y,w,h]=v;const cx=x+w/2,cy=y+h/2;if(w/h<r)w=h*r;else h=w/r;return[cx-w/2,cy-h/2,w,h]}

function zoomAt(f,px,py){let w=Math.max(25,Math.min(1500,cur[2]/f));const k=w/cur[2];cur=[px-(px-cur[0])*k,py-(py-cur[1])*k,w,cur[3]*k];setVB();settle()}
